name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main

    steps:
      - name: Install cmake
        run: |
          apk add cmake

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch full clone
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --prune --unshallow

      - name: Configure project
        run: |
          cmake -B build -DRELEASE=OFF -DPATCHER_ENABLE_SPLASH=OFF

      - name: Build launcher
        run: |
          cmake --build build --target launcher

      - name: Build OSDMenu without KELF signing
        run: |
          cmake --build build --target osdmenu_unc

      - name: Show generated files
        run: |
          echo "===== GENERATED FILES ====="
          find build -type f \( \
            -name "*.elf" -o \
            -name "*.irx" -o \
            -name "*.bin" \
          \) -print

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: osdmenu-1.3.0-splash-off
          path: |
            build/**/*.elf
            build/**/*.irx
            build/**/*.bin
          if-no-files-found: error
