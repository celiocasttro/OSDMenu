name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main

    steps:
      - name: Install cmake
        run: |
          apk add cmake

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch full clone
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --prune --unshallow

      - name: Compile project
        id: make
        env:
          KELFSERVER_API_ADDRESS: ""
          KELFSERVER_API_KEY: ""
        run: |
          cmake -B build -DRELEASE=OFF -DPATCHER_ENABLE_SPLASH=OFF
          cmake --build build --target launcher
          cmake --build build --target osdmenu

      - name: Show build files
        if: steps.make.outcome == 'success'
        run: |
          echo "===== BUILD FILES ====="
          find build -type f \( \
            -name "*.elf" -o \
            -name "*.irx" -o \
            -name "*.bin" -o \
            -name "*.iso" -o \
            -name "*.kelf" \
          \) -print

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: steps.make.outcome == 'success'
        with:
          name: osdmenu-patcher-splash-off
          path: |
            build/**/*.elf
            build/**/*.irx
            build/**/*.bin
            build/**/*.iso
            build/**/*.kelf
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions: write-all
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Fetch full clone
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --prune --unshallow

      - name: Get git describe
        run: |
          echo "GIT_VERSION=$(git describe --always --dirty --tags --exclude nightly)" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Prepare release archive
        run: |
          cd osdmenu-patcher-splash-off
          zip -r ../osdmenu-${{ env.GIT_VERSION }}.zip ./*

      - uses: "marvinpinto/action-automatic-releases@latest"
        if: github.ref == 'refs/heads/main'
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "nightly"
          prerelease: true
          title: "Nightly build"
          files: |
            osdmenu-${{ env.GIT_VERSION }}.zip

      - uses: "marvinpinto/action-automatic-releases@latest"
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          draft: true
          files: |
            osdmenu-${{ env.GIT_VERSION }}.zip
